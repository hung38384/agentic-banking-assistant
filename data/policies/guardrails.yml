version: "2026-06-08"
name: "Banking Assistant Guardrails"
rules:
  - id: "LLM01_PROMPT_INJECTION"
    action: "block"
    severity: "high"
    description: "Block direct prompt injection, system prompt extraction, or tool bypass attempts."
  - id: "LLM02_SENSITIVE_INFORMATION_DISCLOSURE"
    action: "redact_and_audit"
    severity: "high"
    description: "Redact PII before LLM calls and avoid storing raw personal data in logs."
  - id: "LLM05_IMPROPER_OUTPUT_HANDLING"
    action: "validate_output"
    severity: "medium"
    description: "Validate structured outputs and require citations for document-grounded answers."
  - id: "LLM06_EXCESSIVE_AGENCY"
    action: "human_approval"
    severity: "high"
    description: "Require human approval for side-effect actions and high-risk tools."
  - id: "LLM08_VECTOR_EMBEDDING_WEAKNESSES"
    action: "hybrid_retrieval_and_rerank"
    severity: "medium"
    description: "Use hybrid retrieval, reranking, and document instruction quarantine."

