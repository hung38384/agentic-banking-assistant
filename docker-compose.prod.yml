services:
  api:
    image: ${IMAGE_NAME:-ghcr.io/your-org/agentic-banking-assistant:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      VECTOR_BACKEND: chroma
      CHROMA_DIR: /app/.chroma
      MEMORY_PATH: /app/data/runtime/conversation_memory.json
    volumes:
      - chroma_data:/app/.chroma
      - runtime_data:/app/data/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
  runtime_data:
