[project]
name = "agentic-banking-assistant"
version = "0.1.0"
description = "Production-oriented FastAPI banking assistant with LangGraph agents, RAG, memory, tools, guardrails, and evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langgraph>=0.2.35",
  "langchain-core>=0.3.0",
  "chromadb>=0.5.5",
  "openai>=1.40.0",
  "google-genai>=1.0.0",
  "numpy>=1.26.0",
  "python-multipart>=0.0.9",
  "structlog>=24.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0"
]
ragas = [
  "ragas>=0.2.0",
  "datasets>=2.20.0",
  "langchain-openai>=0.2.0"
]
observability = [
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp>=1.25.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "scripts*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
